# Reelfold desk app (apps/desk), run as parallel jobs so a push finishes in ~15 min instead of ~25-80:
#   checks (macOS)        check_skill, lint + typecheck, unit tests, sidecar real-engine tests, scripts tests
#   e2e (macOS, 3 shards) the Electron e2e suite (hidden windows, mock + real engine), playwright --shard=i/3
#   test                  aggregator: green only when checks + every e2e shard passed. Keep this name: the release
#                         automation waits on Desk CI's job named `test`.
#   e2e-report            merges the shards' blob reports into one HTML report artifact (desk-e2e-report)
#   Windows ...           the same checks + engine pytest (xdist) + the e2e suite in 4 shards on windows-latest; the
#                         `Windows` aggregator fails the run like before, but `test` does not wait for it.
# Nothing is tiered away: every push runs the whole suite. Tags (v*) and the nightly schedule run it too, and a tag
# run is never cancelled (path filters are not evaluated for tag pushes, so a tag always runs everything).
name: Desk CI
on:
  pull_request:
    paths:
      - 'apps/desk/**'
      - 'lib/**'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desk-ci.yml'
  push:
    branches: [main, 'release/**']
    tags: ['v*']
    paths:
      - 'apps/desk/**'
      - 'lib/**'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desk-ci.yml'
  schedule:
    - cron: '17 9 * * *' # nightly (UTC): catches flaky or environment drift (runner images, brew / choco ffmpeg)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desk-ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }} # nightly never cancels a push run
  # a newer push supersedes an older run of the same branch / PR; a tag run (release) is never cancelled
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  DESK_HIDE_WINDOW: '1'
jobs:
  checks:
    name: checks (lint, unit, engine, scripts)
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: pip }
      - name: Engine deps for the sidecar's real-engine tests (no local ASR models)
        working-directory: .
        run: |
          grep -v whisper requirements.txt > "$RUNNER_TEMP/req.txt"
          python -m pip install -r "$RUNNER_TEMP/req.txt"
          python -c "import yaml, numpy"   # fail here, not deep inside a test
          brew install ffmpeg
          # the app would otherwise pick the runner's Homebrew python3 (no engine deps) before this one
          echo "DESK_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: .
      - name: check_skill (personal paths / secrets in apps/)
        working-directory: .
        run: python scripts/check_skill.py
      - run: npm run lint
      - name: Unit tests
        if: success() || failure()
        run: npm run test:unit
      - name: Sidecar real-engine tests
        if: success() || failure()
        run: npm run test:engine
      - name: Scripts tests (App Store lint + runtime patch)
        if: success() || failure()
        run: npm run test:scripts

  e2e:
    name: e2e (${{ matrix.shard }}/3)
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: apps/desk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: pip }
      - name: Engine deps for the real-engine e2e tests (no local ASR models)
        working-directory: .
        run: |
          grep -v whisper requirements.txt > "$RUNNER_TEMP/req.txt"
          python -m pip install -r "$RUNNER_TEMP/req.txt"
          python -c "import yaml, numpy"   # fail here, not deep inside an e2e test
          brew install ffmpeg
          echo "DESK_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: .
      - run: npm run build
      - name: Electron e2e shard ${{ matrix.shard }}/3 (hidden windows, mock + real engine)
        env: { PW_BLOB: '1' }
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: desk-e2e-blob-${{ matrix.shard }}
          path: apps/desk/blob-report
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desk-test-results-${{ matrix.shard }}
          path: apps/desk/test-results
          retention-days: 7

  test:
    # the required / awaited check: green only when every macOS job above passed
    name: test
    needs: [checks, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All macOS checks and e2e shards passed
        env:
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "checks: $CHECKS, e2e shards: $E2E"
          [ "$CHECKS" = success ] && [ "$E2E" = success ]

  e2e-report:
    name: e2e report (merged)
    needs: [e2e]
    if: always() && needs.e2e.result != 'skipped' && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@v7
        with: { pattern: desk-e2e-blob-*, path: apps/desk/all-blob-reports, merge-multiple: true }
      - name: Merge the shards' reports
        run: |
          v=$(node -p "require('../../package-lock.json').packages['node_modules/@playwright/test'].version")
          npx -y "@playwright/test@$v" merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with: { name: desk-e2e-report, path: apps/desk/playwright-report, retention-days: 14 }

  windows-checks:
    name: Windows checks (lint, unit, start, engine)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/desk
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: pip }
      - name: Engine deps + ffmpeg
        working-directory: .
        run: |
          python -m pip install -r tests/requirements.txt pytest-xdist
          python -c "import yaml, numpy, cv2, mediapipe, faster_whisper, xdist; print('deps ok')"
          # the Chocolatey download fails now and then: retry, and show why when it does
          for i in 1 2 3; do
            choco install ffmpeg -y --no-progress > "$RUNNER_TEMP/choco.log" 2>&1 && break
            tail -20 "$RUNNER_TEMP/choco.log"; sleep 30
          done
          ffmpeg -hide_banner -version | head -1
          echo "DESK_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: .
      - run: npm run lint
      # every check below runs even after a failure, so one run shows all Windows failures
      - name: Unit tests
        if: success() || failure()
        run: npm run test:unit
      - name: Build
        if: success() || failure()
        run: npm run build
      - name: App start check (main log)
        if: success() || failure()
        run: node scripts/startCheck.mjs 45
      - name: Sidecar engine tests
        if: success() || failure()
        run: python -m unittest discover -s engine/tests
      - name: Engine pytest (parallel, pytest-xdist)
        if: success() || failure()
        working-directory: .
        run: python -m pytest -q -p no:cacheprovider -n auto

  windows-e2e:
    name: Windows e2e (${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
        working-directory: apps/desk
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: pip }
      - name: Engine deps + ffmpeg
        working-directory: .
        run: |
          python -m pip install -r tests/requirements.txt
          python -c "import yaml, numpy, cv2, mediapipe, faster_whisper; print('deps ok')"
          for i in 1 2 3; do
            choco install ffmpeg -y --no-progress > "$RUNNER_TEMP/choco.log" 2>&1 && break
            tail -20 "$RUNNER_TEMP/choco.log"; sleep 30
          done
          ffmpeg -hide_banner -version | head -1
          echo "DESK_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: .
      - name: Electron binary (downloaded up front, not lazily inside the first test)
        working-directory: .
        run: node node_modules/electron/install.js && node -e "console.log(require('electron'))"
      - run: npm run build
      - name: Electron e2e shard ${{ matrix.shard }}/4 (hidden windows, mock + real engine)
        # like the macOS job (no local ASR models): faster-whisper is installed for the engine's pytest parity, and
        # would download a Whisper model inside an e2e run
        env: { HF_HUB_OFFLINE: '1' }
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desk-test-results-windows-${{ matrix.shard }}
          path: apps/desk/test-results
          retention-days: 7

  windows:
    # one status for every Windows job; a failure here fails the run (but not `test`, which only covers macOS)
    name: Windows
    needs: [windows-checks, windows-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All Windows checks and e2e shards passed
        env:
          CHECKS: ${{ needs.windows-checks.result }}
          E2E: ${{ needs.windows-e2e.result }}
        run: |
          echo "windows checks: $CHECKS, e2e shards: $E2E"
          [ "$CHECKS" = success ] && [ "$E2E" = success ]
