# Shared setup for the Desk CI jobs (macOS + Windows): node + npm cache, python (deps via uv), the Electron /
# electron-builder download caches (keyed on package-lock.json), ffmpeg (Windows: cached per month instead of a
# Chocolatey download per job), the engine's python deps, `npm ci`, and DESK_PYTHON.
name: Desk setup
description: node, python, engine deps, ffmpeg, npm ci for apps/desk jobs
inputs:
  engine-deps:
    description: "'desk' = runtime deps without local ASR (macOS), 'tests' = tests/requirements.txt (Windows parity)"
    default: desk
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with: { node-version: 22, cache: npm }
    - uses: actions/setup-python@v7
      with: { python-version: '3.12' }
    - name: Cache Electron downloads
      uses: actions/cache@v6
      with:
        path: |
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: electron-${{ runner.os }}-
    - name: Month stamp (the Windows ffmpeg cache key)
      if: runner.os == 'Windows'
      id: month
      shell: bash
      run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
    - name: Cache ffmpeg (Windows)
      if: runner.os == 'Windows'
      id: ffmpeg-cache
      uses: actions/cache@v6
      with:
        path: ~/ffmpeg-bin
        key: ffmpeg-choco-${{ runner.os }}-${{ steps.month.outputs.month }}
    - name: ffmpeg
      shell: bash
      env:
        FFMPEG_CACHED: ${{ steps.ffmpeg-cache.outputs.cache-hit }}
      run: |
        if [ "$RUNNER_OS" = Windows ]; then
          if [ "$FFMPEG_CACHED" != true ]; then
            # the Chocolatey download fails now and then: retry, and show why when it does
            for i in 1 2 3; do
              choco install ffmpeg -y --no-progress > "$RUNNER_TEMP/choco.log" 2>&1 && break
              tail -20 "$RUNNER_TEMP/choco.log"; sleep 30
            done
            exe=$(find /c/ProgramData/chocolatey/lib/ffmpeg -name ffmpeg.exe | head -1)
            [ -n "$exe" ] || { echo "::error::ffmpeg.exe not found after choco install"; exit 1; }
            mkdir -p ~/ffmpeg-bin && cp "$(dirname "$exe")"/*.exe ~/ffmpeg-bin/
          fi
          cygpath -w ~/ffmpeg-bin >> "$GITHUB_PATH"
          export PATH="$HOME/ffmpeg-bin:$PATH"
        else
          command -v ffmpeg > /dev/null || brew install ffmpeg
          brew list pango > /dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install pango
        fi
        ffmpeg -hide_banner -version | head -1
    - name: Cache native text libraries (Windows)
      if: runner.os == 'Windows'
      id: text-cache
      uses: actions/cache@v6
      with:
        path: |
          apps/desk/build/.cache
          apps/desk/build/runtime/win32-x64/ffmpeg
        key: text-native-win32-${{ hashFiles('apps/desk/packaging/ffmpeg/win32-x64.txt', 'apps/desk/packaging/runtime.lock.json', 'apps/desk/scripts/runtime/*.mjs') }}
    - name: Native text libraries (Windows; same locked stack as the app)
      if: runner.os == 'Windows'
      shell: bash
      env:
        TEXT_CACHED: ${{ steps.text-cache.outputs.cache-hit }}
      run: |
        if [ "$TEXT_CACHED" != true ]; then
          node apps/desk/scripts/runtime/bundle.mjs --target=win32-x64 --only=ffmpeg
        fi
        node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'VSTUDIO_TEXT_LAYOUT_DIR=' + require('path').resolve('apps/desk/build/runtime/win32-x64/ffmpeg/bin') + '\n')"
    - name: Engine python deps
      shell: bash
      env:
        ENGINE_DEPS: ${{ inputs.engine-deps }}
      run: |
        # uv: parallel wheel downloads + a fast install (pip took ~1 min on Windows even with its download cache). Its
        # wheel cache is not kept between runs: fetching the wheels again is quicker than restoring them unzipped.
        python -m pip install -q uv
        if [ "$ENGINE_DEPS" = tests ]; then
          uv pip install --system -r tests/requirements.txt
          python -c "import yaml, numpy, cv2, mediapipe, faster_whisper, xdist; print('deps ok')"
        else
          # no local ASR models: the whisper packages are left out
          grep -v whisper requirements.txt > "$RUNNER_TEMP/req.txt"
          uv pip install --system -r "$RUNNER_TEMP/req.txt"
          python -c "import yaml, numpy; print('deps ok')"   # fail here, not deep inside a test
        fi
        # the app would otherwise pick the runner's own python3 (no engine deps) before this one
        echo "DESK_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
    - name: npm ci
      shell: bash
      run: npm ci
