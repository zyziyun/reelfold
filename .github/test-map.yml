# Globs whose automatic trace is skipped (it would reach nearly every spec); only their `e2e:` entries run.
e2e_no_trace:
  - apps/desk/src/renderer/src/i18n/**
  - apps/desk/src/renderer/src/theme/**

# A test id that this many specs use is a landmark (home, the studio list, the composer: most specs wait on it). A
# changed view selects the specs through its other ids; only when it has nothing else do landmark ids count.
e2e_landmark_specs: 8

# Sharding: a selection is split by these estimates (seconds, from a CI run on macos-14; unlisted specs count as
# e2e_default_weight), one shard per e2e_seconds_per_shard, at most 4.
e2e_default_weight: 20
e2e_seconds_per_shard: 300
e2e_weights:
  smoke-all.spec.ts: 308
  projectPage.spec.ts: 182
  explainerVisuals.spec.ts: 127
  fewerSteps.spec.ts: 97
  clipInfo.spec.ts: 88
  vlogFraming.spec.ts: 84
  vlogRefresh.spec.ts: 79
  i18nStrict.spec.ts: 72
  studioReal.spec.ts: 72
  studioScaleSchedule.spec.ts: 54
  v04.spec.ts: 52
  homeScale.spec.ts: 51
  autopilot.spec.ts: 50
  homeReal.spec.ts: 50
  promoFixes.spec.ts: 49
  chatEdit.spec.ts: 46
  runView.spec.ts: 46
  create.spec.ts: 39
  recordEdit.spec.ts: 39
  homeRequests.spec.ts: 37
  uxcore.spec.ts: 34
  inboxReal.spec.ts: 32
  studioScale.spec.ts: 29
  update.spec.ts: 26
  release.spec.ts: 25

