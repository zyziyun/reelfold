# Which tests a change runs in the quick tier (a push / PR). Read by .github/scripts/select_tests.py; how it traces a
# change to tests is described at the top of that script and in docs/CI_CD.md. Paths are repo-relative globs
# (`*` = within a folder, `**` = any depth); spec names are files in apps/desk/tests/e2e.
# The full tier (nightly, tags v*, release/**, tier=full) ignores this file and runs everything.

# Any of these changed: every test of the suite runs (the build, the test harness or the dependencies changed).
full:                     # both suites
  - package.json
  - package-lock.json
  - requirements.txt
  - tests/requirements.txt
  - .github/actions/**
  - .github/scripts/ci-changes.sh
  - .github/scripts/select_tests.py
  - .github/test-map.yml
full_desk:
  - .github/workflows/desk-ci.yml
  - apps/desk/package.json
  - apps/desk/playwright.config.ts
  - apps/desk/vite.config.ts
  - apps/desk/tsconfig.json
  - apps/desk/scripts/build.mjs
  - apps/desk/scripts/startCheck.mjs
  - apps/desk/packaging/**
  - apps/desk/src/renderer/index.html
  - apps/desk/src/main/testHooks.ts
  - apps/desk/engine/tests/_isolate.py
  - apps/desk/tests/e2e/closeApp.ts
full_engine:
  - .github/workflows/engine.yml
  - pyproject.toml
  - tests/conftest.py

# No test reads these.
ignore:
  - '**/*.md'
  - '**/LICENSE'
  - apps/desk/release-notes/**
  - apps/desk/docs/**
  - docs/**

# The quick, broad specs a change runs when nothing more specific is known (main process, preload, unmapped desk code).
e2e_smoke:
  - smoke.spec.ts
  - studio.spec.ts
  - noMock.spec.ts
  - settings.spec.ts

# The same for an engine change the desk loads (apps/desk/engine, lib/): specs on the real engine sidecar.
e2e_real_smoke:
  - studioReal.spec.ts
  - homeReal.spec.ts
  - inboxReal.spec.ts
  - tryAgain.spec.ts
  - draftReview.spec.ts

# Specs for code the trace cannot follow (main process, engine). Added to what the trace finds.
