[project]
name = "vstudio"
version = "0.2.0"
description = "Shared library for the video-studio Claude Code skill"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["lib"]

[tool.pytest.ini_options]
# engine tests only; the desk sidecar's tests (apps/desk/engine/tests) run with `npm run test:engine` in apps/desk
testpaths = ["tests"]
pythonpath = ["lib"]
norecursedirs = ["apps", "node_modules", ".git"]
# `slow`: long real renders; CI skips them on a normal push / PR and runs them in the full tier (.github/workflows/engine.yml)
markers = ["slow: long real-render test, run in CI's full tier (nightly, tags, release branches, manual runs)"]
