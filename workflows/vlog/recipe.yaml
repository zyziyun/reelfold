# Recipe manifest (vstudio.project). Schema: lib/vstudio/project/manifest.schema.json - docs: references/PROJECTS.md
id: vlog
version: 1
workflow: vlog
labels: {zh: "Vlog", en: "Travel vlog"}
description:
  zh: 一次旅行的素材（航拍 / 手机）→ 联系表浏览 → 选段与节奏（舒缓 / 卡点）→ 调色、转场、弹字、音效 → 配乐 → 封面 → 多平台导出
  en: a trip's footage (drone / phone) -> contact sheets -> windows and pacing (calm / beat-cut) -> grade, transitions, pops, sfx -> music -> cover -> per-platform exports
category: edit
inputs:
  - key: footage
    kind: video
    labels: {zh: "素材", en: "Footage"}
    required: true
    multiple: true
    accept: [.mp4, .mov, .m4v, .MP4, .MOV]
    scope: project
  - key: photos
    kind: photos
    labels: {zh: "照片（可选）", en: "Photos (optional)"}
    required: false
    multiple: true
    scope: project
  - key: music
    kind: audio
    labels: {zh: "音乐", en: "Music"}
    required: false
    accept: [.mp3, .wav, .m4a]
    scope: project
items:
  sources: [single, episodes, variants]
  per_item: [title, style]
  shared: [style, platforms]
  variants: [platform]
params:
  type: object
  properties:
    style:
      enum: [calm, fun]
      default: calm
      title: Calm (crossfades) / fun (beat-cut reel)
      x-zh: 舒缓 / 卡点快节奏
    platforms:
      type: array
      items: {type: string}
      default: ["xiaohongshu:full"]
      title: Platforms
      x-zh: 发布平台
    sheet_every:
      type: number
      minimum: 1
      maximum: 30
      default: 4
      title: Contact sheet tile every N s
      x-zh: 联系表每隔几秒一格
    preset:
      enum: [ultrafast, veryfast, fast, medium, slow]
      default: medium
      title: x264 preset
      x-zh: 编码速度
    title:
      type: string
      default: ""
      title: Title
      x-zh: 标题
      x-scope: item
    reframe:
      enum: [follow, blur]
      default: follow
      title: Landscape on vertical canvases (follow the subject / fill with blur)
      x-zh: 横屏素材上竖屏（跟随主体 / 模糊填充）
      x-scope: item
stages:
  - id: probe
    resource: io
    keys: [style, platforms]
    run:
      argv: ["{python}", "{workflow_dir}/scripts/probe.py", "{input.footage*}", "--init", "{item_dir}/work/edit.json",
             "--style", "{style}", {if: platform, args: ["--platform", "{platform}"]},
             {if: input.music, args: ["--music", "{input.music}"]}]
      stdout: "{item_dir}/work/probe.txt"
      files: ["{item_dir}/work/edit.json", "{item_dir}/work/probe.txt"]
    produces: [work/edit.json (starter, never overwritten), work/probe.txt]
    preview: {kind: text, path: "{item_dir}/work/probe.txt"}
  - id: sheets
    resource: cpu
    deps: [probe]
    keys: [sheet_every]
    run:
      argv: ["{python}", "{workflow_dir}/scripts/contact_sheets.py", "{item_dir}/work/sheets", "{sheet_every}", "{input.footage*}"]
      files: ["{item_dir}/work/sheets"]
    produces: [work/sheets/*_sheet.jpg]
    preview: {kind: images, path: "{item_dir}/work/sheets/*.jpg", label: {zh: "联系表", en: "Contact sheet", fr: "Planche contact"}}
  - id: render
    resource: cpu-render
    deps: [sheets]
    fn: vstudio.project.adapters.vlog:render
    keys: [platforms, preset]
    watch: ["{item_dir}/work/edit.json"]
    units: one
    produces: [the master (edit.json out)]
    wip: {kind: videos, path: "{item_dir}/work/clips/seg_*.mp4", label: {zh: "调色片段", en: "Graded segment", fr: "Plan étalonné"}}
    preview: {kind: video, path: "out:master", label: {zh: "成片（未配乐）", en: "Master, no music yet", fr: "Montage, sans musique"}}
  - id: music
    resource: cpu
    deps: [render]
    fn: vstudio.project.adapters.vlog:music
    keys: [platforms, music_pick]
    produces: [out/vlog_music.mp4 (calm + your track or the picked library track; credit -> post copy if CC BY)]
    preview: {kind: video, path: "out:master", label: {zh: "配好乐的成片", en: "With music", fr: "Avec la musique"}}
  - id: cover_frames
    resource: cpu
    deps: [music]
    fn: vstudio.project.adapters.common:cover_frames
    keys: [title]
    produces: [cand_<k>.jpg]
    preview: {kind: image, path: "out:sheet", label: {zh: "封面候选", en: "Cover options", fr: "Couvertures possibles"}}
  - id: copy
    resource: cpu
    deps: [music]
    fn: vstudio.project.adapters.vlog:copy
    keys: [platforms, title, music_pick]
    produces: [post.ai.json + post.rules.json (title, body, hashtags per platform in its language; place from the DJI logs; music credit)]
    preview: {kind: json, path: "out:post"}
  - id: export
    resource: cpu-render
    deps: [cover_frames, music, render, copy]
    keys: [platforms, preset, cover, reframe, copy_pick]
    run:
      argv: ["{python}", "-m", "vstudio.export", "{out.music.master}", "--platforms", "{platforms_csv}", "--out",
             "{item_dir}/exports", "--mode", "{reframe}", "--preset", "{preset}",
             {if: out.render.shots, args: ["--shots", "{out.render.shots}"]},
             {if: cover.file, args: ["--cover", "{cover.file}"]}, {if: cover.v916, args: ["--cover", "{cover.v916}"]},
             {if: cover.v34, args: ["--cover", "{cover.v34}"]},
             {if: cover.en, args: ["--cover", "youtube={cover.en}"]},
             {if: cover.en_v916, args: ["--cover", "youtube-shorts={cover.en_v916}"]},
             {if: cover.bili, args: ["--cover", "bilibili={cover.bili}"]},
             {if: cover.youtube_ab, args: ["--cover-ab", "youtube={cover.youtube_ab}"]},
             {if: title, args: ["--title", "{title}"]},
             {if: out.music.post, args: ["--post", "{out.music.post}"]},
             {if: out.copy.post, args: ["--post", "{out.copy.post}"]},
             {if: copy_pick.file, args: ["--post", "{copy_pick.file}"]}]
      files: ["{item_dir}/exports/manifest.json"]
    produces: ["exports/<platform>-<orientation>.mp4 + cover + post.md (landscape on a vertical canvas: the camera follows the subject, or a blurred fill)"]
checkpoints:
  - id: edit
    kind: author
    scope: item
    after: sheets
    blocks: [render]
    labels: {zh: "选段与节奏", en: "Windows and pacing"}
    help:
      zh: 看联系表，在 work/edit.json 写 segments（舒缓）或 shots（卡点）与音乐、标题、地图
      en: From the contact sheets, write segments (calm) or shots (fun) + music, title, map in work/edit.json
    author:
      file: "{item_dir}/work/edit.json"
      format: vlog edit.json (examples/edit.example.json / edit.fun.example.json)
      doc: workflows/vlog/WORKFLOW.md
    payload: vstudio.project.adapters.common:author_payload
    apply: vstudio.project.adapters.common:author_apply
    answer:
      type: object
      properties: {done: {type: boolean}, content: {type: string}}
    auto: never
  - id: music
    kind: music-pick
    scope: item
    after: render
    blocks: [music]
    labels: {zh: "选配乐", en: "Pick the music"}
    help:
      zh: 从免版权曲库（你的 ~/Music/Reelfold 或内置配乐）里按你的描述和风格挑了最合适的三首，或不配乐
      en: The three best fits for your words and the style from the license-free library (your ~/Music/Reelfold or the built-in beds), or no music
    payload: vstudio.project.adapters.vlog:music_payload
    apply: vstudio.project.adapters.vlog:music_apply
    answer:
      type: object
      properties: {pick: {type: integer, minimum: 0}}
      required: [pick]
    auto: default
  - id: cover
    kind: cover-pick
    scope: item
    after: cover_frames
    blocks: [export]
    labels: {zh: "选封面", en: "Pick the cover"}
    payload: vstudio.project.adapters.common:cover_payload
    apply: vstudio.project.adapters.common:cover_apply
    answer:
      type: object
      properties: {pick: {type: integer, minimum: 0}, t: {type: number}, text: {type: string}}
    auto: default
  - id: framing
    kind: reframe-pick
    scope: item
    after: music
    blocks: [export]
    labels: {zh: "竖屏取景", en: "Vertical framing"}
    help:
      zh: 横屏素材放到竖屏平台：镜头跟随画面里的主体（默认），或整幅画面放在模糊背景上
      en: Landscape footage on the vertical platforms - the camera follows the subject in each shot (default), or the whole frame on a blurred fill
    payload: vstudio.project.adapters.vlog:framing_payload
    apply: vstudio.project.adapters.vlog:framing_apply
    current: vstudio.project.adapters.vlog:framing_current
    remake: vstudio.project.adapters.vlog:framing_remake
    answer:
      type: object
      properties: {pick: {type: integer, minimum: 0}}
      required: [pick]
    auto: default
  - id: copy
    kind: copy-pick
    scope: item
    after: copy
    blocks: [export]
    labels: {zh: "发布文案", en: "Post copy"}
    help:
      zh: 每个平台的标题、正文和话题（按平台语言）：AI 写的，或按事实（地点、月份、你的原话）写的
      en: Title, text and hashtags per platform, in its language - written by the AI, or from the facts (place, month, your words)
    payload: vstudio.project.adapters.vlog:copy_payload
    apply: vstudio.project.adapters.vlog:copy_apply
    current: vstudio.project.adapters.vlog:copy_current
    remake: vstudio.project.adapters.vlog:copy_remake
    answer:
      type: object
      properties: {pick: {type: integer, minimum: 0}}
      required: [pick]
    auto: default
  - id: publish
    kind: publish
    scope: item
    after: export
    labels: {zh: "审片发布", en: "Review and publish"}
    payload: vstudio.project.adapters.common:publish_payload
    apply: vstudio.project.adapters.common:publish_apply
    answer:
      type: object
      properties: {approve: {type: boolean}, reason: {type: string}}
      required: [approve]
    auto: default
outputs:
  platforms: ["xiaohongshu:full", douyin, tiktok, youtube-shorts, youtube, bilibili]
  collect: vstudio.project.adapters.common:collect_vstudio_exports
agent:
  workflow_md: workflows/vlog/WORKFLOW.md
  notes: Look at work/sheets/*.jpg before writing work/edit.json; build_fun.py --dry-run plans a fun reel without rendering. Refresh after edits.
  edit_files: ["{item_dir}/work/edit.json"]
gaps:
  - Window / shot selection from the contact sheets is agent / human work (no automatic picker).
  - The music is picked from the local license-free library only (your music folders + the built-in beds); a CC-BY catalog track (fetch_music.sh) is used once it sits in ~/Music/Reelfold. Calm cuts are fixed before the music (no beat alignment); the fun style cuts to the edit's own music. The scrapbook cover (make_cover.py) needs Chrome and is replaced here by a frame + text cover.
capabilities: [grade, transitions, beat-cuts, sfx, pops, music, cover, export, reframe, post-copy]
